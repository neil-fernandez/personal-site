<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SecureBank fraud detection pipeline">
  <defs>
    <marker id="sb-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-arrow)" />
    </marker>
  </defs>

  <rect x="160" y="60" width="400" height="70" rx="12" fill="var(--diagram-box)" stroke="var(--diagram-box-stroke)" stroke-width="1.5"/>
  <text x="360" y="89" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-title)">Three data sources</text>
  <text x="360" y="111" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-subtitle)">customer · transactions · fraud</text>

  <line x1="360" y1="130" x2="360" y2="182" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#sb-arrow)"/>

  <rect x="160" y="190" width="400" height="70" rx="12" fill="var(--diagram-box)" stroke="var(--diagram-box-stroke)" stroke-width="1.5"/>
  <text x="360" y="219" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-title)">Secure ETL and join</text>
  <text x="360" y="241" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-subtitle)">injection-hardened SQL</text>

  <line x1="360" y1="260" x2="360" y2="312" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#sb-arrow)"/>

  <rect x="160" y="320" width="400" height="70" rx="12" fill="var(--diagram-box)" stroke="var(--diagram-box-stroke)" stroke-width="1.5"/>
  <text x="360" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-title)">Fraud detection</text>
  <text x="360" y="371" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-subtitle)">features + model</text>

  <line x1="360" y1="390" x2="360" y2="442" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#sb-arrow)"/>

  <rect x="160" y="450" width="400" height="70" rx="12" fill="var(--diagram-accent)" stroke="var(--diagram-accent-stroke)" stroke-width="1.5"/>
  <text x="360" y="479" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-accent-title)">Flagged cases</text>
  <text x="360" y="501" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-accent-subtitle)">access-controlled</text>
</svg>
