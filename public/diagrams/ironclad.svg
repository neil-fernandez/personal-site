<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IronClad face identification pipeline">
  <defs>
    <marker id="ic-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-arrow)" />
    </marker>
  </defs>

  <rect x="160" y="30" width="400" height="70" rx="12" fill="var(--diagram-box)" stroke="var(--diagram-box-stroke)" stroke-width="1.5"/>
  <text x="360" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-title)">Input photo</text>
  <text x="360" y="81" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-subtitle)">blurry, dark, or noisy</text>

  <line x1="360" y1="100" x2="360" y2="132" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ic-arrow)"/>

  <rect x="160" y="140" width="400" height="70" rx="12" fill="var(--diagram-box)" stroke="var(--diagram-box-stroke)" stroke-width="1.5"/>
  <text x="360" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-title)">MTCNN detection</text>
  <text x="360" y="191" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-subtitle)">locate and crop the face</text>

  <line x1="360" y1="210" x2="360" y2="242" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ic-arrow)"/>

  <rect x="160" y="250" width="400" height="70" rx="12" fill="var(--diagram-box)" stroke="var(--diagram-box-stroke)" stroke-width="1.5"/>
  <text x="360" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-title)">Embedding model</text>
  <text x="360" y="301" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-subtitle)">vggface2 vs casia-webface</text>

  <line x1="360" y1="320" x2="360" y2="352" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ic-arrow)"/>

  <rect x="160" y="360" width="400" height="70" rx="12" fill="var(--diagram-box)" stroke="var(--diagram-box-stroke)" stroke-width="1.5"/>
  <text x="360" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-title)">Gallery search</text>
  <text x="360" y="411" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-subtitle)">cosine similarity</text>

  <line x1="360" y1="430" x2="360" y2="462" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ic-arrow)"/>

  <rect x="160" y="470" width="400" height="70" rx="12" fill="var(--diagram-accent)" stroke="var(--diagram-accent-stroke)" stroke-width="1.5"/>
  <text x="360" y="499" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="var(--diagram-accent-title)">Top-5 matches</text>
  <text x="360" y="521" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="var(--diagram-accent-subtitle)">ranked by confidence</text>
</svg>
