<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MovieMate recommendation pipeline">
  <defs>
    <marker id="mm-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect x="160" y="30" width="400" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Ratings</text>
  <text x="360" y="81" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">the films a user has liked</text>

  <line x1="360" y1="100" x2="360" y2="132" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mm-arrow)"/>

  <rect x="160" y="140" width="400" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">SVD factorisation</text>
  <text x="360" y="191" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">user and item latent factors</text>

  <line x1="360" y1="210" x2="360" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mm-arrow)"/>

  <rect x="160" y="250" width="400" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="279" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Similarity scoring</text>
  <text x="360" y="301" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">genre overlap + popularity prior</text>

  <line x1="360" y1="320" x2="360" y2="352" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mm-arrow)"/>

  <rect x="160" y="360" width="400" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Diversity rerank</text>
  <text x="360" y="411" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">alpha = 0.90</text>

  <line x1="360" y1="430" x2="360" y2="462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mm-arrow)"/>

  <rect x="160" y="470" width="400" height="70" rx="12" fill="#1a7de0" stroke="#1764b5" stroke-width="1.5"/>
  <text x="360" y="499" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Top-N recommendations</text>
  <text x="360" y="521" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cfe6ff">ranked and explainable</text>
</svg>
